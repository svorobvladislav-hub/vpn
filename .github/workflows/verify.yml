name: NextVPN Auto Collector

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Collect, Test & Push to Gist
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: python collector.py
