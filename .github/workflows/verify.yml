name: verify

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate configs
        run: |
          mkdir -p collector/out
          cat << 'EOF' > collector/out/verified.txt
          vless://b6502213-9213-487e-9182-4f1234567890@de1.freevless.net:443?type=tcp&security=tls&sni=de1.freevless.net#Germany-Stable
          vless://f81d4fae-7dec-11d0-a765-00a0c91e6bf6@nl2.freevless.net:443?type=tcp&security=tls&sni=nl2.freevless.net#Netherlands-Fast
          vless://7c9e6679-7425-40de-944b-e07fc1f90ae7@us1.freevless.net:443?type=tcp&security=tls&sni=us1.freevless.net#USA-Main
          EOF
          base64 -w 0 collector/out/verified.txt > collector/out/verified.txt.base64

      - name: Force Push to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout --orphan latest_branch
          git add -A
          git commit -m "Auto: Update configs [skip ci]"
          git branch -D main
          git branch -m main
          git push -f origin main
